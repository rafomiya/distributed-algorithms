x-computer: &computer
  build: .
  image: ic-printing:dev
  restart: "no"
  cap_add: [NET_ADMIN]
  environment: &computer-env
    NUM_NODES: ${NUM_NODES:-3}
    SEED: ${SEED:-42}
    RPC_TIMEOUT: ${RPC_TIMEOUT:-0.8}
    RETRY_INTERVAL: ${RETRY_INTERVAL:-0.2}
    GOSSIP_INTERVAL: ${GOSSIP_INTERVAL:-0.5}
    GOSSIP_FANOUT: ${GOSSIP_FANOUT:-1}
    DATA_ITEMS: ${DATA_ITEMS:-5}
    PEER_HOST_SUFFIX: -computers
    LOG_DIR: /data/logs
  volumes:
    - ${LOG_DIR:-./data/logs}:/data/logs
  networks: [computers, printers]
  healthcheck: &health
    test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
    interval: 1s
    timeout: 1s
    retries: 30

x-printer: &printer
  build: .
  image: ic-printing:dev
  command: ["python", "-m", "node.printer"]
  restart: "no"
  environment:
    PAGE_SECONDS: ${PAGE_SECONDS:-0.15}
    LOG_DIR: /data/logs
  volumes:
    - ${LOG_DIR:-./data/logs}:/data/logs
  networks: [printers]
  healthcheck: *health

services:
  node1:
    <<: *computer
    hostname: node1
    ports: ["127.0.0.1:8001:8000"]
    networks: {computers: {aliases: [node1-computers]}, printers: {}}
  node2:
    <<: *computer
    hostname: node2
    ports: ["127.0.0.1:8002:8000"]
    networks: {computers: {aliases: [node2-computers]}, printers: {}}
  node3:
    <<: *computer
    hostname: node3
    ports: ["127.0.0.1:8003:8000"]
    networks: {computers: {aliases: [node3-computers]}, printers: {}}
  node4:
    <<: *computer
    hostname: node4
    ports: ["127.0.0.1:8004:8000"]
    networks: {computers: {aliases: [node4-computers]}, printers: {}}
  node5:
    <<: *computer
    hostname: node5
    ports: ["127.0.0.1:8005:8000"]
    networks: {computers: {aliases: [node5-computers]}, printers: {}}
  printer1: {<<: *printer, hostname: printer1, ports: ["127.0.0.1:9001:8000"]}
  printer2: {<<: *printer, hostname: printer2, ports: ["127.0.0.1:9002:8000"]}

networks:
  computers: {driver: bridge}
  printers: {driver: bridge}
