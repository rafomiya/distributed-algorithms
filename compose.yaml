x-node: &node
  build: .
  image: node:dev
  cap_add: [NET_ADMIN]          # necessário para tc/netem e iptables
  restart: "no"                 # crash-stop: quem cair, fica caído até `recover`
  environment:
    NUM_NODES: ${NUM_NODES:-3}
    SEED: ${SEED:-42}
    ALGO: ${ALGO:-heartbeat}
    RPC_TIMEOUT: ${RPC_TIMEOUT:-0.8}
    PORT: "8000"
  volumes:
    - ./data/logs:/data/logs
  networks: [dsnet]
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
    interval: 2s
    timeout: 1s
    retries: 10

services:
  node1:  {<<: *node, hostname: node1,  container_name: node1,  ports: ["8001:8000"]}
  node2:  {<<: *node, hostname: node2,  container_name: node2,  ports: ["8002:8000"]}
  node3:  {<<: *node, hostname: node3,  container_name: node3,  ports: ["8003:8000"]}
  node4:  {<<: *node, hostname: node4,  container_name: node4,  ports: ["8004:8000"]}
  node5:  {<<: *node, hostname: node5,  container_name: node5,  ports: ["8005:8000"]}
  node6:  {<<: *node, hostname: node6,  container_name: node6,  ports: ["8006:8000"]}
  node7:  {<<: *node, hostname: node7,  container_name: node7,  ports: ["8007:8000"]}
  node8:  {<<: *node, hostname: node8,  container_name: node8,  ports: ["8008:8000"]}
  node9:  {<<: *node, hostname: node9,  container_name: node9,  ports: ["8009:8000"]}
  node10: {<<: *node, hostname: node10, container_name: node10, ports: ["8010:8000"]}

networks:
  dsnet:
    driver: bridge
